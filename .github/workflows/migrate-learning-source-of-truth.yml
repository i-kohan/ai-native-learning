name: Migrate learning source of truth

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-learning-source-of-truth.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch master learning plan
        env:
          PATCH_B64: 
        run: python -c "import os,base64; exec(base64.b64decode(os.environ['PATCH_B64']))"

      - name: Verify migration
        run: |
          grep -q "only durable source of truth" docs/learning/master-learning-plan.md
          grep -q "learning-process.md" docs/learning/master-learning-plan.md
          ! grep -q "following the attached master learning plan" docs/learning/master-learning-plan.md
          ! grep -q '^Give it:$' docs/learning/master-learning-plan.md

      - name: Commit migration and remove temporary workflow
        run: |
          git config user.name "ai-native-learning-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-learning-source-of-truth.yml
          git add docs/learning/master-learning-plan.md
          git commit -m "Make GitHub the single learning source of truth"
          git push origin HEAD:main
